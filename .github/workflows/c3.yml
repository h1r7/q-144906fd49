name: c3
on:
  workflow_dispatch:
    inputs:
      archive_url:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      member:
        required: true
        type: string
      target_sha256:
        required: true
        type: string
      address:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      INPUT_URL: ${{ inputs.archive_url }}
      INPUT_ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
      INPUT_MEMBER: ${{ inputs.member }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha256 }}
      INPUT_ADDRESS: ${{ inputs.address }}
      REA_ANALYSIS_PROVIDER: ghidra
      REA_GHIDRA_STARTUP_TIMEOUT_MS: '1800000'
      GHIDRA_HEADLESS_MAXMEM: 8G
    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out deps
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          node --version > out/node-version.txt
          "$JAVA_HOME_21_X64/bin/java" -version 2> out/java-version.txt
          npm install --prefix deps --save-exact --ignore-scripts --no-audit --no-fund rea-agents@6.4.0 > out/install.txt
          curl --fail --location --silent --show-error 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o deps/g.zip
          printf '%s  %s\n' 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db' deps/g.zip | sha256sum -c -
          unzip -q deps/g.zip -d deps
          echo "GHIDRA_INSTALL_DIR=$PWD/deps/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, zipfile
          url=os.environ['INPUT_URL']
          if not url.startswith('https://setup-aws.rbxcdn.com/mac/'):
              raise ValueError('unsupported public archive origin')
          urllib.request.urlretrieve(url, 'deps/input.zip')
          archive=pathlib.Path('deps/input.zip')
          ah=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert ah==os.environ['INPUT_ARCHIVE_SHA']
          with zipfile.ZipFile(archive) as z:
              data=z.read(os.environ['INPUT_MEMBER'])
          th=hashlib.sha256(data).hexdigest()
          assert th==os.environ['INPUT_TARGET_SHA']
          pathlib.Path('deps/target').write_bytes(data)
          pathlib.Path('out/identity.json').write_text(json.dumps({'url':url,'archive_sha256':ah,'member':os.environ['INPUT_MEMBER'],'target_sha256':th,'bytes':len(data),'target_executed':False},indent=2))
          PY
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          REA="$PWD/deps/node_modules/rea-agents/scripts/rea.mjs"
          node "$REA" doctor --provider ghidra --json > out/doctor.json
          date -u +%FT%TZ > out/start.txt
          start=$SECONDS
          node "$REA" function "$PWD/deps/target" "$INPUT_ADDRESS" --provider ghidra --snapshot "$PWD/out/snapshot.json" --format json > out/function.json
          echo "$((SECONDS-start))" > out/cold-seconds.txt
          start=$SECONDS
          node "$REA" function "$PWD/deps/target" "$INPUT_ADDRESS" --provider ghidra --snapshot "$PWD/out/snapshot.json" --format json > out/function-replay.json
          echo "$((SECONDS-start))" > out/replay-seconds.txt
          date -u +%FT%TZ > out/end.txt
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence
          path: out/
          retention-days: 3
